<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FitBuddy - AI Workout Generator</title>
<style>
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#111827;color:#fff;
       display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
  .card{background:#1f2937;padding:32px;border-radius:14px;width:360px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  h1{text-align:center;font-size:20px;margin-top:0;}
  label{display:block;font-size:13px;color:#9ca3af;margin:10px 0 4px;}
  input,select{width:100%;padding:9px;border-radius:8px;border:1px solid #374151;background:#111827;color:#fff;}
  button{margin-top:18px;width:100%;padding:11px;background:#3b82f6;color:#fff;border:none;
         border-radius:8px;font-size:15px;cursor:pointer;}
  button:hover{background:#2563eb;}
</style>
</head>
<body>
  <div class="card">
    <h1>💪 FitBuddy - AI Workout Generator</h1>
    <form action="/generate-workout" method="post">
      <label>Name</label>
      <input type="text" name="username" required>
      <label>User ID</label>
      <input type="number" name="user_id" required>
      <label>Age</label>
      <input type="number" name="age" required>
      <label>Weight (kg)</label>
      <input type="number" step="0.1" name="weight" required>
      <label>Fitness Goal</label>
      <input type="text" name="goal" placeholder="e.g. weight loss, flexibility" required>
      <label>Workout Intensity</label>
      <select name="intensity">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button type="submit">Generate Plan</button>
    </form>
  </div>
</body>
</html>
